<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1WIN VIP GLITCH - Instant Cash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0b0118 0%, #1a0b2e 50%, #05000a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .header {
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 900;
        }
        .header p {
            font-size: 12px;
            color: #ffcc00;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
            letter-spacing: 0.5px;
        }
        .attempts-counter {
            font-size: 11px;
            color: #ff3366;
            margin-bottom: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255, 51, 102, 0.1);
            padding: 4px 10px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid rgba(255, 51, 102, 0.3);
        }
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 20px auto;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid #ff0055;
            z-index: 10;
            filter: drop-shadow(0 0 6px #ff0055);
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            border: 4px solid #00ffcc;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0077ff 100%);
            color: #05000a;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            width: 100%;
            text-transform: uppercase;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-content {
            background: linear-gradient(135deg, #1b0232 0%, #3a0ca3 100%);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #00ffcc;
            width: 100%;
            max-width: 330px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,255,204,0.4);
        }
        .modal-content h2 {
            color: #00ffcc;
            margin-bottom: 10px;
            font-size: 18px;
            text-shadow: 0 0 8px rgba(0,255,204,0.5);
        }
        .modal-content p {
            font-size: 13px;
            margin-bottom: 18px;
            color: #f0f0f0;
            line-height: 1.4;
        }
        .progress-bar {
            background: #111;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .progress-fill {
            background: linear-gradient(90deg, #ff0055, #ffcc00);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚡ 1WIN VIP SYSTEM GLITCH ⚡</h1>
            <p>🔥 BYPASS ALGORITHM & CASH OUT INSTANTLY 🔥</p>
        </div>

        <div class="attempts-counter" id="attemptsText">Attempts Remaining: 3</div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>

        <button class="btn" id="spinBtn" onclick="startSpin()">SPIN NOW 🚀</button>
    </div>

    <!-- Modal for Rewards / Sharing / Final Payout -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">🎁 FREE SPINS UNLOCKED!</h2>
            <p id="modalText">Awesome! You triggered the secret system bypass. Claim your free spins now to unlock the 500% Jackpot!</p>
            
            <div id="shareSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="shareCountText" style="font-size: 11px; color: #ffcc00; margin-bottom: 12px; font-weight: bold;">Shared: 0 / 5 Groups</p>
            </div>

            <button class="btn" id="modalActionBtn" onclick="handleModalAction()">CLAIM & SPIN AGAIN 🎰</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const shareSection = document.getElementById('shareSection');
        const progressFill = document.getElementById('progressFill');
        const shareCountText = document.getElementById('shareCountText');
        const modalActionBtn = document.getElementById('modalActionBtn');
        const attemptsText = document.getElementById('attemptsText');

        // 6 Sectors in exact clockwise order:
        // 0: FREE SPINS, 1: 300$ CASH, 2: 100$ CASH, 3: 400 CRYPTO, 4: 1000% BONUS, 5: 500% BONUS
        const sectors = [
            { color: '#ff0055', text: 'FREE SPINS' },
            { color: '#ff5500', text: '300$ CASH' },
            { color: '#00ffcc', text: '100$ CASH' },
            { color: '#9900ff', text: '400 CRYPTO' },
            { color: '#ffcc00', text: '1000% BONUS' },
            { color: '#00ccff', text: '500% BONUS' }
        ];

        const numSectors = sectors.length;
        const arc = (2 * Math.PI) / numSectors;
        let currentRotation = 0; // Tracks total radians rotated
        let spinCount = 0; // 0 = first spin, 1 = second spin
        let shares = 0;
        const targetShares = 5;
        let isSpinning = false;
        let modalStage = 1; // 1 = First Reward, 2 = Share Loop, 3 = Final Payout

        function drawWheel(rotationAngle) {
            const center = 200;
            const radius = 180;
            const innerRadius = 25;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sectors.forEach((sector, i) => {
                const startAngle = rotationAngle + i * arc;
                const endAngle = startAngle + arc;

                // Draw Slice
                ctx.beginPath();
                ctx.arc(center, center, radius, startAngle, endAngle, false);
                ctx.arc(center, center, innerRadius, endAngle, startAngle, true);
                ctx.fillStyle = sector.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Draw Text Properly Oriented
                ctx.save();
                ctx.translate(center, center);
                const textAngle = startAngle + arc / 2;
                ctx.rotate(textAngle);
                
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px Arial';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                
                ctx.fillText(sector.text, radius - 35, 6);
                ctx.restore();
            });
        }

        // Initial draw at 0 rotation
        drawWheel(0);

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            // Determine target index: 
            // Spin 1 -> Index 0 (FREE SPINS)
            // Spin 2 -> Index 5 (500% BONUS)
            let targetIndex = (spinCount === 0) ? 0 : 5;

            // Mathematical calculation to land precisely under the top pointer (-Math.PI / 2)
            const pointerAngle = -Math.PI / 2;
            const targetSectorCenterAngle = targetIndex * arc + arc / 2;
            
            // Full extra rotations for suspense (e.g. 6 full spins)
            const fullSpins = 6 * 2 * Math.PI;
            
            // Calculate final absolute rotation angle needed
            const normalizedCurrent = currentRotation % (2 * Math.PI);
            const targetRotation = currentRotation - normalizedCurrent + fullSpins + (pointerAngle - targetSectorCenterAngle);

            let startAngleVal = currentRotation;
            let startTime = null;
            const duration = 4000; // 4 seconds spin duration for realistic feel

            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                const progress = (currentTime - startTime) / duration;

                if (progress < 1) {
                    // Cubic ease out for smooth deceleration
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    currentRotation = startAngleVal + (targetRotation - startAngleVal) * easeOut;
                    drawWheel(currentRotation);
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = targetRotation;
                    drawWheel(currentRotation);
                    isSpinning = false;
                    setTimeout(showRewardModal, 400);
                }
            }

            requestAnimationFrame(animate);
        }

        function showRewardModal() {
            modal.style.display = 'flex';
            if (spinCount === 0) {
                modalStage = 1;
                modalTitle.innerHTML = "🎁 FREE SPINS UNLOCKED!";
                modalText.innerHTML = "Boom! You hit the <strong>FREE SPINS</strong> booster. Claim your free spin right now to trigger the 500% VIP Jackpot!";
                shareSection.style.display = "none";
                modalActionBtn.innerHTML = "CLAIM & SPIN AGAIN 🎰";
            } else {
                modalStage = 2; // Share loop stage
                modalTitle.innerHTML = "🔥 500% BONUS JACKPOT HIT!";
                modalText.innerHTML = "Incredible! You unlocked the massive <strong>500% VIP Glitch</strong>! To bypass security and unlock instant cashout, share with <strong>5 Telegram groups</strong>.";
                shareSection.style.display = "block";
                updateShareUI();
            }
        }

        function handleModalAction() {
            if (modalStage === 1) {
                modal.style.display = 'none';
                spinCount = 1;
                spinBtn.disabled = false;
                spinBtn.innerHTML = "SPIN FOR 500% BONUS 🔥";
                attemptsText.innerHTML = "Attempts Remaining: 2";
            } else if (modalStage === 2) {
                const botUsername = "Casino_Hacker_Pro_Bot"; 
                const shareText = encodeURIComponent("🚨 HOLY SHIT! I just unlocked the 500% Casino Glitch & Free Cash on 1win! Try it before it gets patched:");
                const shareUrl = `https://t.me/share/url?url=https://t.me/${botUsername}&text=${shareText}`;

                window.open(shareUrl, '_blank');

                if (shares < targetShares) {
                    shares++;
                    updateShareUI();

                    if (shares >= targetShares) {
                        modalStage = 3; // Final Payout Stage with high temptation
                        modalTitle.innerHTML = "🏆 JACKPOT FULLY SECURED!";
                        modalText.innerHTML = "⚡ Verification complete! Your exclusive <strong>500% Bonus & Fast Payout</strong> are fully unlocked and ready to claim. Tap below to get your reward!";
                        shareSection.style.display = "none";
                        modalActionBtn.innerHTML = "GET YOUR REWARD 🚀";
                        modalActionBtn.style.background = "#00ffcc";
                    }
                }
            } else if (modalStage === 3) {
                // Redirect to the exact link requested
                window.location.href = "https://telegram-app-36lq.onrender.com";
            }
        }

        function updateShareUI() {
            const percentage = (shares / targetShares) * 100;
            progressFill.style.width = percentage + '%';
            shareCountText.innerHTML = `Shared: ${shares} / ${targetShares} Groups`;
            modalActionBtn.innerHTML = `SHARE TO TELEGRAM (${shares}/${targetShares})`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1WIN VIP GLITCH - Spin & Win</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle, #1a0033 0%, #0d001a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .header {
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 13px;
            color: #ffcc00;
            margin-top: 5px;
            font-weight: bold;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff0055;
            z-index: 10;
            filter: drop-shadow(0 0 5px #ff0055);
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            border: 5px solid #00ffcc;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
            color: #0d001a;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            width: 100%;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-content {
            background: linear-gradient(135deg, #2a0845 0%, #6441A5 100%);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #00ffcc;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,255,204,0.4);
        }
        .modal-content h2 {
            color: #00ffcc;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .modal-content p {
            font-size: 14px;
            margin-bottom: 20px;
            color: #ddd;
            line-height: 1.4;
        }
        .progress-bar {
            background: #111;
            border-radius: 10px;
            height: 15px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .progress-fill {
            background: linear-gradient(90deg, #ff0055, #ffcc00);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚡ 1WIN VIP GLITCH ⚡</h1>
            <p id="instruction">SPIN #1: UNLOCK FREE SPINS & BOOSTERS!</p>
        </div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>

        <button class="btn" id="spinBtn" onclick="startSpin()">SPIN NOW 🚀</button>
    </div>

    <!-- Modal for Sharing Loop / Rewards -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">🎉 JACKPOT UNLOCKED!</h2>
            <p id="modalText">You won <strong>500% BONUS + $750 GLITCH</strong>! Share with 4 friends or groups on Telegram to activate payout.</p>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="shareCountText" style="font-size: 12px; color: #ffcc00; margin-bottom: 15px;">Shares: 0 / 4</p>

            <button class="btn" id="modalActionBtn" onclick="handleShare()">SHARE TO TELEGRAM (0/4)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const progressFill = document.getElementById('progressFill');
        const shareCountText = document.getElementById('shareCountText');
        const modalActionBtn = document.getElementById('modalActionBtn');
        const instruction = document.getElementById('instruction');

        const sectors = [
            { color: '#ff0055', text: 'FREE SPIN' },
            { color: '#00ccff', text: '$100 CASH' },
            { color: '#ffcc00', text: '500% BONUS' },
            { color: '#9900ff', text: '$300 CASH' },
            { color: '#00ffcc', text: 'VIP ACCESS' },
            { color: '#ff5500', text: '$750 GLITCH' }
        ];

        const arc = Math.PI / (sectors.length / 2);
        let angle = 0;
        let spinCount = 0; 
        let shares = 0;
        const targetShares = 4;
        let isSpinning = false;

        function drawWheel() {
            const outsideRadius = 180;
            const textRadius = 110;
            const insideRadius = 30;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sectors.forEach((sector, i) => {
                const angleStart = angle + i * arc;
                const angleEnd = angle + (i + 1) * arc;

                ctx.beginPath();
                ctx.arc(200, 200, outsideRadius, angleStart, angleEnd, false);
                ctx.arc(200, 200, insideRadius, angleEnd, angleStart, true);
                ctx.fillStyle = sector.color;
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(angleStart + arc / 2);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(sector.text, textRadius - 30, 6);
                ctx.restore();
            });
        }

        drawWheel();

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            let stopAngleIndex;
            if (spinCount === 0) {
                stopAngleIndex = 0; // FREE SPIN
            } else {
                stopAngleIndex = 2; // 500% BONUS
            }

            const randomSpins = 5 * 2 * Math.PI; 
            const sectorAngle = arc;
            const targetAngle = randomSpins + (sectors.length - stopAngleIndex) * sectorAngle - (sectorAngle / 2);

            let currentAngle = angle;
            let startTime = null;
            const duration = 3500; 

            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                const progress = (currentTime - startTime) / duration;

                if (progress < 1) {
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    angle = currentAngle + targetAngle * easeOut;
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    angle = currentAngle + targetAngle;
                    drawWheel();
                    isSpinning = false;
                    setTimeout(showRewardModal, 500);
                }
            }

            requestAnimationFrame(animate);
        }

        function showRewardModal() {
            modal.style.display = 'flex';
            if (spinCount === 0) {
                modalTitle.innerHTML = "🎁 FREE SPIN UNLOCKED!";
                modalText.innerHTML = "You hit the <strong>FREE SPIN</strong> booster! Tap below to claim and spin for the ultimate 500% Bonus Glitch.";
                modalActionBtn.innerHTML = "CLAIM & SPIN AGAIN 🎰";
            } else {
                modalTitle.innerHTML = "🔥 500% BONUS JACKPOT!";
                modalText.innerHTML = "You unlocked the main <strong>500% Glitch + $750</strong>! Share with 4 friends or Telegram groups to instantly withdraw.";
                updateShareUI();
            }
        }

        function handleShare() {
            if (spinCount === 0) {
                modal.style.display = 'none';
                spinCount = 1;
                spinBtn.disabled = false;
                spinBtn.innerHTML = "SPIN FOR 500% BONUS 🔥";
                instruction.innerHTML = "SPIN #2: HIT THE 500% JACKPOT!";
                return;
            }

            const botUsername = "Casino_Hacker_Pro_Bot"; 
            const shareText = encodeURIComponent("🔥 I just unlocked the 500% Casino Glitch & Free Cash on 1win! Try it here:");
            const shareUrl = `https://t.me/share/url?url=https://t.me/${botUsername}&text=${shareText}`;

            window.open(shareUrl, '_blank');

            if (shares < targetShares) {
                shares++;
                updateShareUI();

                if (shares >= targetShares) {
                    modalActionBtn.innerHTML = "ACCESS 1WIN AFFILIATE LINK 🚀";
                    modalActionBtn.style.background = "#00ffcc";
                    modalActionBtn.onclick = redirectToAffiliate;
                    modalTitle.innerHTML = "🏆 GLITCH UNLOCKED!";
                    modalText.innerHTML = "Verification complete! Click below to access the secure 1win payout portal.";
                }
            }
        }

        function updateShareUI() {
            const percentage = (shares / targetShares) * 100;
            progressFill.style.width = percentage + '%';
            shareCountText.innerHTML = `Shares: ${shares} / ${targetShares}`;
            modalActionBtn.innerHTML = `SHARE TO TELEGRAM (${shares}/${targetShares})`;
        }

        function redirectToAffiliate() {
            window.location.href = "https://1win.pro/?open=register"; 
        }
    </script>
</body>
</html>
